<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stop Motion Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }


  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;        /* track the *visible* viewport on mobile (browser chrome) */
    overflow: hidden;
    overscroll-behavior: none;  /* no pull-to-refresh / rubber-banding */
    user-select: none;
  }


  /* ── TOP TOOLBAR ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #16213e;
    border-bottom: 2px solid #0f3460;
    flex-shrink: 0;
    flex-wrap: wrap;
  }


  #toolbar h1 {
    font-size: 16px;
    font-weight: 700;
    color: #e94560;
    letter-spacing: 1px;
    margin-right: 4px;
    white-space: nowrap;
  }


  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px;
    border-left: 1px solid #0f3460;
  }


  .tool-label {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
  }


  /* Color swatches */
  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: white; transform: scale(1.15); }


  #customColor {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid #555;
    cursor: pointer;
    padding: 0;
    background: none;
    overflow: hidden;
  }
  #customColor::-webkit-color-swatch-wrapper { padding: 0; }
  #customColor::-webkit-color-swatch { border: none; border-radius: 50%; }


  /* Brush size */
  #brushSize {
    width: 80px;
    accent-color: #e94560;
    cursor: pointer;
  }


  .icon-btn {
    background: #0f3460;
    border: none;
    color: #eee;
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .icon-btn:hover { background: #1a4a8a; transform: scale(1.03); }
  .icon-btn.active { background: #e94560; }
  .icon-btn.danger { background: #6b1a1a; }
  .icon-btn.danger:hover { background: #a02020; }


  /* Ghost opacity */
  #ghostOpacity {
    width: 70px;
    accent-color: #e94560;
    cursor: pointer;
  }


  /* ── CANVAS AREA ── */
  #canvasWrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d1a;
    position: relative;
    overflow: hidden;
  }


  #displayCanvas {
    background: white;
    cursor: crosshair;
    touch-action: none;
    box-shadow: 0 0 30px rgba(233,69,96,0.3);
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
  }


  /* ── BOTTOM STRIP ── */
  #bottomBar {
    background: #16213e;
    border-top: 2px solid #0f3460;
    flex-shrink: 0;
  }


  #controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    flex-wrap: wrap;
  }


  #playBtn {
    background: #e94560;
    font-size: 18px;
    padding: 6px 14px;
    border-radius: 50px;
  }
  #playBtn:hover { background: #c73050; }


  #fpsLabel {
    font-size: 11px;
    color: #888;
  }


  #fpsRange {
    width: 70px;
    accent-color: #e94560;
    cursor: pointer;
  }


  #frameCount {
    font-size: 12px;
    color: #aaa;
    margin-left: auto;
  }


  /* Frame strip */
  #filmStrip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px 8px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: #0f3460 transparent;
  }
  #filmStrip::-webkit-scrollbar { height: 4px; }
  #filmStrip::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 2px; }


  .frame-thumb {
    position: relative;
    flex-shrink: 0;
    cursor: pointer;
    border-radius: 4px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.1s;
  }
  .frame-thumb:hover { transform: scale(1.05); }
  .frame-thumb.active { border-color: #e94560; }


  .frame-thumb canvas {
    display: block;
    width: 60px;
    height: 45px;
    background: white;
  }


  .frame-num {
    position: absolute;
    bottom: 2px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 9px;
    color: rgba(255,255,255,0.8);
    background: rgba(0,0,0,0.4);
    pointer-events: none;
  }


  .del-frame-btn {
    position: absolute;
    top: 1px;
    right: 1px;
    width: 14px;
    height: 14px;
    background: rgba(233,69,96,0.85);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 9px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .frame-thumb:hover .del-frame-btn { display: flex; }


  #addFrameBtn {
    flex-shrink: 0;
    width: 60px;
    height: 45px;
    background: #0f3460;
    border: 2px dashed #1a4a8a;
    border-radius: 4px;
    color: #aaa;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  #addFrameBtn:hover { background: #1a4a8a; color: white; }


  /* Playback overlay */
  #playOverlay {
    display: none;
    position: absolute;
    top: 8px;
    right: 12px;
    background: rgba(233,69,96,0.85);
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    pointer-events: none;
  }


  #undoBtn { font-size: 15px; }

  /* Export dropdown menu (opens upward, since it sits at the bottom bar) */
  .menu-wrap { position: relative; display: inline-flex; }
  .popup-menu {
    position: absolute;
    bottom: calc(100% + 6px);
    right: 0;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    z-index: 100;
  }
  .popup-menu[hidden] { display: none; }
  .menu-item {
    background: none;
    border: none;
    color: #eee;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .menu-item:hover { background: #0f3460; }


  /* Avoid the 300ms double-tap zoom delay and stray text selection on controls */
  .icon-btn, .swatch, #customColor, input[type="range"] { touch-action: manipulation; }


  /* ── RESPONSIVE / MOBILE ──────────────────────────────────
     Goal: keep every control *visible* (nothing cropped off-screen) while
     the chrome stays compact enough that the canvas keeps its space. We let
     the bars WRAP rather than scroll — a control hidden off the edge is
     worse than one on a second row — and shrink them on small screens (drop
     the wordmark and the text labels, tighten gaps) so they need as few rows
     as possible. In portrait the canvas is width-limited, so an extra
     toolbar row costs it no size; in landscape the trimmed toolbar collapses
     back to a single row.

     Two triggers, OR'd together, because phones are small in *different*
     dimensions depending on orientation: portrait phones are narrow
     (max-width), landscape phones are short (max-height, ~375–430px tall). */
  @media (max-width: 768px), (max-height: 500px) {
    #toolbar  { gap: 6px; padding: 6px 8px; }
    #controls { gap: 6px; padding: 6px 8px; }

    /* Drop the wordmark and the small text labels — the swatches and sliders
       speak for themselves — so groups pack tightly and wrap less. */
    #toolbar h1 { display: none; }
    .tool-group { padding: 0 4px; gap: 5px; flex-shrink: 0; }
    .tool-group .tool-label { display: none; }

    /* The film strip is the one bar that genuinely needs horizontal scroll
       (arbitrarily many frames); keep it swipe-scrollable on its own. */
    #filmStrip {
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
    }
  }

  /* Landscape phones are height-constrained: trim the chrome further so the
     canvas (what the user actually cares about) gets the vertical room. */
  @media (orientation: landscape) and (max-height: 500px) {
    #toolbar { padding: 4px 8px; }
    #controls { padding: 3px 8px; }
    #filmStrip { padding: 3px 8px 4px; }
    .frame-thumb canvas,
    #addFrameBtn { width: 52px; height: 39px; }
    #addFrameBtn { font-size: 18px; }
    #playBtn { padding: 4px 12px; font-size: 16px; }

    /* Shave the sliders and buttons so the whole toolbar fits on one row even
       on the narrowest landscape phones (~812px), maximizing canvas height. */
    #brushSize { width: 60px; }
    #ghostOpacity { width: 56px; }
    #toolbar .icon-btn { padding: 4px 8px; font-size: 12px; }
  }
</style>
</head>
<body>


<!-- TOP TOOLBAR -->
<div id="toolbar">
  <h1>🎬 STOP MOTION</h1>


  <div class="tool-group">
    <span class="tool-label">Color</span>
    <div class="swatch active" style="background:#222222" data-color="#222222"></div>
    <div class="swatch" style="background:#e94560" data-color="#e94560"></div>
    <div class="swatch" style="background:#f7a928" data-color="#f7a928"></div>
    <div class="swatch" style="background:#2ecc71" data-color="#2ecc71"></div>
    <div class="swatch" style="background:#3498db" data-color="#3498db"></div>
    <div class="swatch" style="background:#9b59b6" data-color="#9b59b6"></div>
    <div class="swatch" style="background:#ffffff; border:2px solid #555" data-color="#ffffff"></div>
    <input type="color" id="customColor" value="#ff6600" title="Custom color">
  </div>


  <div class="tool-group">
    <span class="tool-label">Size</span>
    <input type="range" id="brushSize" min="1" max="40" value="6">
    <span id="brushSizeVal" style="font-size:12px;width:22px">6</span>
  </div>


  <div class="tool-group">
    <button class="icon-btn" id="eraserBtn" title="Eraser (E)">🧹 Erase</button>
    <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">↩ Undo</button>
    <button class="icon-btn danger" id="clearBtn" title="Clear frame">🗑 Clear</button>
    <button class="icon-btn danger" id="newBtn" title="Start new animation">🆕 New</button>
  </div>


  <div class="tool-group">
    <span class="tool-label">Ghost</span>
    <input type="range" id="ghostOpacity" min="0" max="80" value="40" title="Ghost opacity">
    <span id="ghostVal" style="font-size:12px;width:28px">40%</span>
  </div>
</div>


<!-- CANVAS -->
<div id="canvasWrap">
  <canvas id="displayCanvas"></canvas>
  <div id="playOverlay">▶ PLAYING</div>
</div>


<!-- BOTTOM BAR -->
<div id="bottomBar">
  <div id="controls">
    <button class="icon-btn" id="playBtn" title="Play/Pause (Space)">▶</button>
    <span class="tool-label">FPS</span>
    <input type="range" id="fpsRange" min="1" max="24" value="8">
    <span id="fpsVal" style="font-size:12px;width:28px">8</span>
    <button class="icon-btn" id="dupBtn" title="Duplicate current frame">⊕ Duplicate</button>
    <span id="frameCount">Frame 1 / 1</span>

    <button class="icon-btn" id="importBtn" title="Open a saved project (.json) and resume it" style="margin-left:auto;">📂 Import</button>
    <button class="icon-btn" id="saveProjectBtn" title="Save the project to a file you can reopen later">💾 Save</button>
    <div class="menu-wrap">
      <button class="icon-btn" id="exportBtn" title="Export the animation as a video or GIF"
              style="background:#2ecc71;color:#000;font-weight:700;">⬇ Export ▾</button>
      <div id="exportMenu" class="popup-menu" hidden>
        <button class="menu-item" data-fmt="webm">🎬 WebM video</button>
        <button class="menu-item" data-fmt="gif">🖼️ Animated GIF</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <div id="filmStrip">
    <button id="addFrameBtn" title="Add blank frame">+</button>
  </div>
</div>


<script>
// ── CONSTANTS ──────────────────────────────────────────────
const FRAME_W = 800;
const FRAME_H = 600;


// ── STATE ──────────────────────────────────────────────────
let frames = [];           // array of offscreen Canvas elements
let currentIdx = 0;
let isDrawing = false;
let tool = 'pen';          // 'pen' | 'eraser'
let color = '#222222';
let brushRadius = 6;
let ghostOpacity = 0.40;
let isPlaying = false;
let playInterval = null;
let fps = 8;
let undoStack = [];        // per-frame undo: array of ImageData
const MAX_UNDO = 20;


// ── CANVAS SETUP ──────────────────────────────────────────
const display = document.getElementById('displayCanvas');
const ctx = display.getContext('2d');
display.width = FRAME_W;
display.height = FRAME_H;


function resizeDisplay() {
  const wrap = document.getElementById('canvasWrap');
  const availW = wrap.clientWidth - 24;
  const availH = wrap.clientHeight - 24;
  // Fill the available space (no cap at native size) so the canvas is as large
  // as it can be — important on landscape phones and tablets.
  const scale = Math.min(availW / FRAME_W, availH / FRAME_H);
  display.style.width  = Math.floor(FRAME_W * scale) + 'px';
  display.style.height = Math.floor(FRAME_H * scale) + 'px';
}
window.addEventListener('resize', resizeDisplay);


// ── FRAME MANAGEMENT ──────────────────────────────────────
function makeBlankFrame() {
  const c = document.createElement('canvas');
  c.width = FRAME_W; c.height = FRAME_H;
  // Keep transparent — white bg is provided by the display canvas so the ghost shows through
  return c;
}


function cloneFrame(src) {
  const c = document.createElement('canvas');
  c.width = FRAME_W; c.height = FRAME_H;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}


function addFrame(duplicate = false) {
  const f = duplicate ? cloneFrame(frames[currentIdx]) : makeBlankFrame();
  const insertAt = currentIdx + 1;
  frames.splice(insertAt, 0, f);
  undoStack.splice(insertAt, 0, []);
  switchTo(insertAt);
  rebuildStrip();
}


function deleteFrame(idx) {
  if (frames.length === 1) return;
  frames.splice(idx, 1);
  undoStack.splice(idx, 1);
  const newIdx = Math.min(idx, frames.length - 1);
  switchTo(newIdx);
  rebuildStrip();
}


function switchTo(idx) {
  currentIdx = idx;
  render();
  updateFrameCount();
  highlightStrip();
  scrollStripToActive();
}


// ── RENDER ────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, FRAME_W, FRAME_H);


  // White bg
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, FRAME_W, FRAME_H);


  // Ghost: show previous frame (or next during playback ignore)
  if (!isPlaying && currentIdx > 0 && ghostOpacity > 0) {
    ctx.globalAlpha = ghostOpacity;
    ctx.drawImage(frames[currentIdx - 1], 0, 0);
    ctx.globalAlpha = 1;
  }


  // Current frame content
  ctx.drawImage(frames[currentIdx], 0, 0);
}


// ── DRAWING ───────────────────────────────────────────────
function getCanvasPos(e) {
  const rect = display.getBoundingClientRect();
  const scaleX = FRAME_W / rect.width;
  const scaleY = FRAME_H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top)  * scaleY,
  };
}


function saveUndo() {
  const fc = frames[currentIdx].getContext('2d');
  const snap = fc.getImageData(0, 0, FRAME_W, FRAME_H);
  if (!undoStack[currentIdx]) undoStack[currentIdx] = [];
  undoStack[currentIdx].push(snap);
  if (undoStack[currentIdx].length > MAX_UNDO) undoStack[currentIdx].shift();
}


let lastX = 0, lastY = 0;


function startDraw(e) {
  if (isPlaying) return;
  e.preventDefault();
  isDrawing = true;
  const pos = getCanvasPos(e);
  lastX = pos.x; lastY = pos.y;
  saveUndo();


  // Draw a dot for single click
  const fc = frames[currentIdx].getContext('2d');
  fc.lineCap = 'round';
  fc.lineJoin = 'round';
  if (tool === 'eraser') {
    fc.globalCompositeOperation = 'destination-out';
    fc.fillStyle = 'rgba(0,0,0,1)';
    fc.beginPath();
    fc.arc(lastX, lastY, brushRadius, 0, Math.PI * 2);
    fc.fill();
    fc.globalCompositeOperation = 'source-over';
  } else {
    fc.globalCompositeOperation = 'source-over';
    fc.fillStyle = color;
    fc.beginPath();
    fc.arc(lastX, lastY, brushRadius / 2, 0, Math.PI * 2);
    fc.fill();
  }
  render();
}


function draw(e) {
  if (!isDrawing || isPlaying) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  const fc = frames[currentIdx].getContext('2d');
  fc.lineCap = 'round';
  fc.lineJoin = 'round';
  fc.lineWidth = brushRadius * 2;


  if (tool === 'eraser') {
    fc.globalCompositeOperation = 'destination-out';
    fc.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    fc.globalCompositeOperation = 'source-over';
    fc.strokeStyle = color;
  }


  fc.beginPath();
  fc.moveTo(lastX, lastY);
  fc.lineTo(pos.x, pos.y);
  fc.stroke();
  fc.globalCompositeOperation = 'source-over';


  lastX = pos.x; lastY = pos.y;
  render();
  updateThumb(currentIdx);
}


function endDraw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  isDrawing = false;
  updateThumb(currentIdx);
}


display.addEventListener('mousedown', startDraw);
display.addEventListener('mousemove', draw);
display.addEventListener('mouseup', endDraw);
display.addEventListener('mouseleave', endDraw);
display.addEventListener('touchstart', startDraw, { passive: false });
display.addEventListener('touchmove', draw, { passive: false });
display.addEventListener('touchend', endDraw, { passive: false });


// ── PLAYBACK ──────────────────────────────────────────────
let playFrameIdx = 0;


function startPlay() {
  if (frames.length < 2) return;
  isPlaying = true;
  playFrameIdx = 0;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('playOverlay').style.display = 'block';
  playInterval = setInterval(() => {
    // Render frame directly without ghost
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, FRAME_W, FRAME_H);
    ctx.drawImage(frames[playFrameIdx], 0, 0);
    playFrameIdx = (playFrameIdx + 1) % frames.length;
  }, 1000 / fps);
}


function stopPlay() {
  isPlaying = false;
  clearInterval(playInterval);
  playInterval = null;
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('playOverlay').style.display = 'none';
  render();
}


document.getElementById('playBtn').addEventListener('click', () => {
  isPlaying ? stopPlay() : startPlay();
});


// ── FILM STRIP ────────────────────────────────────────────
const filmStrip = document.getElementById('filmStrip');
const addBtn = document.getElementById('addFrameBtn');


function makeThumbEl(idx) {
  const wrap = document.createElement('div');
  wrap.className = 'frame-thumb';
  wrap.dataset.idx = idx;


  const tc = document.createElement('canvas');
  tc.width = FRAME_W; tc.height = FRAME_H;
  const tctx = tc.getContext('2d');
  tctx.fillStyle = 'white';
  tctx.fillRect(0, 0, FRAME_W, FRAME_H);
  tctx.drawImage(frames[idx], 0, 0);
  wrap.appendChild(tc);


  const num = document.createElement('div');
  num.className = 'frame-num';
  num.textContent = idx + 1;
  wrap.appendChild(num);


  const del = document.createElement('button');
  del.className = 'del-frame-btn';
  del.textContent = '×';
  del.title = 'Delete frame';
  del.addEventListener('click', (e) => {
    e.stopPropagation();
    deleteFrame(idx);
  });
  wrap.appendChild(del);


  wrap.addEventListener('click', () => {
    if (!isPlaying) switchTo(idx);
  });


  return wrap;
}


function rebuildStrip() {
  // Remove all except addBtn
  Array.from(filmStrip.querySelectorAll('.frame-thumb')).forEach(el => el.remove());
  frames.forEach((_, i) => {
    filmStrip.insertBefore(makeThumbEl(i), addBtn);
  });
  highlightStrip();
  updateFrameCount();
}


function updateThumb(idx) {
  const thumbs = filmStrip.querySelectorAll('.frame-thumb');
  if (thumbs[idx]) {
    const tc = thumbs[idx].querySelector('canvas');
    const tctx = tc.getContext('2d');
    tctx.fillStyle = 'white';
    tctx.fillRect(0, 0, FRAME_W, FRAME_H);
    tctx.drawImage(frames[idx], 0, 0);
  }
}


function highlightStrip() {
  filmStrip.querySelectorAll('.frame-thumb').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
  });
}


function scrollStripToActive() {
  const thumbs = filmStrip.querySelectorAll('.frame-thumb');
  if (thumbs[currentIdx]) {
    thumbs[currentIdx].scrollIntoView({ inline: 'nearest', behavior: 'smooth' });
  }
}


function updateFrameCount() {
  document.getElementById('frameCount').textContent =
    `Frame ${currentIdx + 1} / ${frames.length}`;
}


addBtn.addEventListener('click', () => addFrame(false));
document.getElementById('dupBtn').addEventListener('click', () => addFrame(true));


// ── TOOLS ─────────────────────────────────────────────────
// Color swatches
document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    color = sw.dataset.color;
    tool = 'pen';
    document.getElementById('eraserBtn').classList.remove('active');
  });
});


const customColorInput = document.getElementById('customColor');
customColorInput.addEventListener('input', () => {
  color = customColorInput.value;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  tool = 'pen';
  document.getElementById('eraserBtn').classList.remove('active');
});


// Brush size
const brushSlider = document.getElementById('brushSize');
const brushVal = document.getElementById('brushSizeVal');
brushSlider.addEventListener('input', () => {
  brushRadius = parseInt(brushSlider.value);
  brushVal.textContent = brushRadius;
});


// Eraser
document.getElementById('eraserBtn').addEventListener('click', () => {
  tool = tool === 'eraser' ? 'pen' : 'eraser';
  document.getElementById('eraserBtn').classList.toggle('active', tool === 'eraser');
});


// Clear
document.getElementById('clearBtn').addEventListener('click', () => {
  saveUndo();
  const fc = frames[currentIdx].getContext('2d');
  fc.clearRect(0, 0, FRAME_W, FRAME_H);
  render();
  updateThumb(currentIdx);
});


// Undo
document.getElementById('undoBtn').addEventListener('click', doUndo);
function doUndo() {
  if (!undoStack[currentIdx] || undoStack[currentIdx].length === 0) return;
  const snap = undoStack[currentIdx].pop();
  const fc = frames[currentIdx].getContext('2d');
  fc.putImageData(snap, 0, 0);
  render();
  updateThumb(currentIdx);
}


// Ghost opacity
const ghostSlider = document.getElementById('ghostOpacity');
const ghostValEl = document.getElementById('ghostVal');
ghostSlider.addEventListener('input', () => {
  ghostOpacity = parseInt(ghostSlider.value) / 100;
  ghostValEl.textContent = ghostSlider.value + '%';
  render();
});


// FPS
const fpsSlider = document.getElementById('fpsRange');
const fpsValEl = document.getElementById('fpsVal');
fpsSlider.addEventListener('input', () => {
  fps = parseInt(fpsSlider.value);
  fpsValEl.textContent = fps;
  if (isPlaying) { stopPlay(); startPlay(); }
});


// ── EXPORT (video / GIF) ──────────────────────────────────
const exportBtn = document.getElementById('exportBtn');
const exportMenu = document.getElementById('exportMenu');


// Open/close the format menu
exportBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  exportMenu.hidden = !exportMenu.hidden;
});
document.addEventListener('click', () => { exportMenu.hidden = true; });
exportMenu.addEventListener('click', (e) => {
  const item = e.target.closest('.menu-item');
  if (!item) return;
  exportMenu.hidden = true;
  if (item.dataset.fmt === 'gif') exportGIF();
  else exportWebM();
});


function setExportBtn(text, disabled) {
  exportBtn.textContent = text;
  exportBtn.disabled = disabled;
}
function resetExportBtn() { setExportBtn('⬇ Export ▾', false); }


// Composite a frame onto the opaque white background it's shown/played on.
function compositeFrameInto(ctx, i) {
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, FRAME_W, FRAME_H);
  ctx.drawImage(frames[i], 0, 0);
}
function frameImageData(i) {
  const c = document.createElement('canvas');
  c.width = FRAME_W; c.height = FRAME_H;
  const cx = c.getContext('2d');
  compositeFrameInto(cx, i);
  return cx.getImageData(0, 0, FRAME_W, FRAME_H);
}


function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}


async function exportWebM() {
  if (frames.length < 1) return;
  if (!window.MediaRecorder) {
    alert('Video export is not supported in this browser. Try Chrome or Firefox, or export a GIF instead.');
    return;
  }
  setExportBtn('⏳ Recording…', true);


  // Pick best supported codec
  const mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';


  const offscreen = document.createElement('canvas');
  offscreen.width = FRAME_W;
  offscreen.height = FRAME_H;
  const offCtx = offscreen.getContext('2d');
  // Draw first frame so the stream has content before recording starts
  compositeFrameInto(offCtx, 0);


  const stream = offscreen.captureStream(fps);
  const recorder = new MediaRecorder(stream, { mimeType });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  const done = new Promise(resolve => { recorder.onstop = resolve; });
  recorder.start();


  const frameDuration = 1000 / fps;
  for (let i = 0; i < frames.length; i++) {
    compositeFrameInto(offCtx, i);
    await new Promise(resolve => setTimeout(resolve, frameDuration));
  }
  recorder.stop();
  await done;


  downloadBlob(new Blob(chunks, { type: mimeType }), 'stopmotion.webm');
  setExportBtn('✅ Saved!', true);
  setTimeout(resetExportBtn, 2000);
}


async function exportGIF() {
  if (frames.length < 1) return;
  setExportBtn('⏳ Encoding GIF…', true);
  // Yield twice so the "Encoding…" label paints before the synchronous encode.
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  try {
    const datas = frames.map((_, i) => frameImageData(i));
    const delay = Math.max(2, Math.round(100 / fps)); // GIF delay is in 1/100 s
    const bytes = encodeGIF(datas, FRAME_W, FRAME_H, delay);
    downloadBlob(new Blob([bytes], { type: 'image/gif' }), 'stopmotion.gif');
    setExportBtn('✅ Saved!', true);
  } catch (err) {
    console.error('GIF export failed:', err);
    alert('Sorry, GIF export failed: ' + err.message);
    resetExportBtn();
    return;
  }
  setTimeout(resetExportBtn, 2000);
}


// ── SELF-CONTAINED GIF89a ENCODER ─────────────────────────
// Animated, infinitely-looping GIF, no dependencies. All frames share one
// global palette reduced to ≤256 colors by median cut — well suited to the
// flat-color line art this app produces — then LZW-compressed per the spec.
function encodeGIF(imageDatas, width, height, delay) {
  const { palette, indexOf } = buildPalette(imageDatas);
  const gctBits = Math.max(1, Math.ceil(Math.log2(palette.length || 1)));
  const gctSize = 1 << gctBits;               // padded to a power of two: 2,4,…,256
  const minCodeSize = Math.max(2, gctBits);   // LZW minimum code size (≥2)


  const out = [];
  const b = v => out.push(v & 0xff);
  const w16 = v => { out.push(v & 0xff); out.push((v >> 8) & 0xff); };
  const str = s => { for (let i = 0; i < s.length; i++) out.push(s.charCodeAt(i)); };


  str('GIF89a');
  // Logical Screen Descriptor
  w16(width); w16(height);
  b(0x80 | ((gctBits - 1) << 4) | (gctBits - 1)); // GCT present + color res + GCT size
  b(0);                                            // background color index
  b(0);                                            // pixel aspect ratio


  // Global Color Table (padded)
  for (let i = 0; i < gctSize; i++) {
    if (i < palette.length) { b(palette[i].r); b(palette[i].g); b(palette[i].b); }
    else { b(0); b(0); b(0); }
  }


  // Netscape 2.0 application extension → loop forever
  b(0x21); b(0xFF); b(0x0B);
  str('NETSCAPE2.0');
  b(0x03); b(0x01); w16(0); b(0x00);


  for (let f = 0; f < imageDatas.length; f++) {
    // Graphic Control Extension (per-frame delay, no transparency)
    b(0x21); b(0xF9); b(0x04);
    b(0x04);          // disposal method 1 (do not dispose), no transparent color
    w16(delay);
    b(0x00);          // transparent color index (unused)
    b(0x00);          // block terminator


    // Image Descriptor
    b(0x2C);
    w16(0); w16(0);   // left, top
    w16(width); w16(height);
    b(0x00);          // no local color table, not interlaced


    // Map pixels → palette indices
    const data = imageDatas[f].data;
    const indices = new Uint8Array(width * height);
    for (let p = 0, q = 0; p < data.length; p += 4, q++) {
      indices[q] = indexOf(data[p], data[p + 1], data[p + 2]);
    }


    // LZW-compressed image data, split into ≤255-byte sub-blocks
    b(minCodeSize);
    const lzw = lzwEncode(indices, minCodeSize);
    for (let i = 0; i < lzw.length; i += 255) {
      const chunk = lzw.subarray(i, Math.min(i + 255, lzw.length));
      b(chunk.length);
      for (let j = 0; j < chunk.length; j++) out.push(chunk[j]);
    }
    b(0x00);          // image block terminator
  }


  b(0x3B);            // trailer
  return new Uint8Array(out);
}


// Build a ≤256-color palette (exact if few colors, else median cut) plus a
// cached nearest-color lookup used to index every pixel.
function buildPalette(imageDatas) {
  const hist = new Map();
  for (const id of imageDatas) {
    const d = id.data;
    for (let p = 0; p < d.length; p += 4) {
      const key = (d[p] << 16) | (d[p + 1] << 8) | d[p + 2];
      hist.set(key, (hist.get(key) || 0) + 1);
    }
  }
  const colors = [];
  for (const [key, count] of hist) {
    colors.push({ r: (key >> 16) & 255, g: (key >> 8) & 255, b: key & 255, count });
  }


  const palette = colors.length <= 256
    ? colors.map(c => ({ r: c.r, g: c.g, b: c.b }))
    : medianCut(colors, 256);


  const cache = new Map();
  function indexOf(r, g, b) {
    const key = (r << 16) | (g << 8) | b;
    let idx = cache.get(key);
    if (idx === undefined) {
      idx = nearestIndex(palette, r, g, b);
      cache.set(key, idx);
    }
    return idx;
  }
  return { palette, indexOf };
}


function nearestIndex(palette, r, g, b) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < palette.length; i++) {
    const p = palette[i];
    const dr = p.r - r, dg = p.g - g, db = p.b - b;
    const d = dr * dr + dg * dg + db * db;
    if (d < bd) { bd = d; best = i; if (d === 0) break; }
  }
  return best;
}


function medianCut(colors, maxColors) {
  const makeBox = list => {
    let rMin = 255, rMax = 0, gMin = 255, gMax = 0, bMin = 255, bMax = 0, count = 0;
    for (const c of list) {
      if (c.r < rMin) rMin = c.r; if (c.r > rMax) rMax = c.r;
      if (c.g < gMin) gMin = c.g; if (c.g > gMax) gMax = c.g;
      if (c.b < bMin) bMin = c.b; if (c.b > bMax) bMax = c.b;
      count += c.count;
    }
    return { list, rMin, rMax, gMin, gMax, bMin, bMax, count };
  };


  let boxes = [makeBox(colors)];
  while (boxes.length < maxColors) {
    // Split the splittable box holding the most pixels.
    let idx = -1, bestCount = -1;
    for (let i = 0; i < boxes.length; i++) {
      if (boxes[i].list.length > 1 && boxes[i].count > bestCount) {
        bestCount = boxes[i].count; idx = i;
      }
    }
    if (idx < 0) break;
    const bx = boxes[idx];
    const rr = bx.rMax - bx.rMin, gr = bx.gMax - bx.gMin, br = bx.bMax - bx.bMin;
    const axis = rr >= gr && rr >= br ? 'r' : (gr >= br ? 'g' : 'b');
    bx.list.sort((a, c) => a[axis] - c[axis]);
    let acc = 0, splitAt = 0;
    const half = bx.count / 2;
    for (; splitAt < bx.list.length - 1; splitAt++) {
      acc += bx.list[splitAt].count;
      if (acc >= half) break;
    }
    boxes.splice(idx, 1, makeBox(bx.list.slice(0, splitAt + 1)), makeBox(bx.list.slice(splitAt + 1)));
  }


  return boxes.map(bx => {
    let r = 0, g = 0, b = 0, n = 0;
    for (const c of bx.list) { r += c.r * c.count; g += c.g * c.count; b += c.b * c.count; n += c.count; }
    return { r: Math.round(r / n), g: Math.round(g / n), b: Math.round(b / n) };
  });
}


// GIF LZW compressor (variable-width codes, matching the GIF89a decoder).
function lzwEncode(indices, minCodeSize) {
  const clearCode = 1 << minCodeSize;
  const eoiCode = clearCode + 1;
  let codeSize, next, dict;


  const out = [];
  let bitBuffer = 0, bitCount = 0;
  function writeCode(code) {
    bitBuffer |= code << bitCount;
    bitCount += codeSize;
    while (bitCount >= 8) {
      out.push(bitBuffer & 0xff);
      bitBuffer >>>= 8;
      bitCount -= 8;
    }
    // Grow the code width once the table has outgrown the current width.
    if (next >= (1 << codeSize) && codeSize < 12) codeSize++;
  }
  function resetDict() {
    dict = new Map();
    codeSize = minCodeSize + 1;
    next = eoiCode + 1;
  }


  resetDict();
  writeCode(clearCode);


  let prefix = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const k = indices[i];
    const key = prefix * 256 + k;       // (prefix code, next index) → combined key
    if (dict.has(key)) {
      prefix = dict.get(key);
    } else {
      writeCode(prefix);
      if (next < 4096) {
        dict.set(key, next);
        next++;
      } else {
        writeCode(clearCode);
        resetDict();
      }
      prefix = k;
    }
  }
  writeCode(prefix);
  writeCode(eoiCode);
  if (bitCount > 0) out.push(bitBuffer & 0xff);
  return Uint8Array.from(out);
}


// ── KEYBOARD SHORTCUTS ────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    isPlaying ? stopPlay() : startPlay();
  } else if (e.key === 'e' || e.key === 'E') {
    tool = tool === 'eraser' ? 'pen' : 'eraser';
    document.getElementById('eraserBtn').classList.toggle('active', tool === 'eraser');
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    doUndo();
  } else if (e.key === 'ArrowRight' && !isPlaying) {
    if (currentIdx < frames.length - 1) switchTo(currentIdx + 1);
  } else if (e.key === 'ArrowLeft' && !isPlaying) {
    if (currentIdx > 0) switchTo(currentIdx - 1);
  } else if (e.key === 'n' || e.key === 'N') {
    if (!isPlaying) addFrame(false);
  } else if (e.key === 'd' || e.key === 'D') {
    if (!isPlaying) addFrame(true);
  }
});


// ── AUTO-SAVE TO LOCALSTORAGE ─────────────────────────────
const STORAGE_KEY = 'stopmotion_v1';
let saveTimer = null;


function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistFrames, 1200);
}


function persistFrames() {
  try {
    const data = {
      fps,
      currentIdx,
      frames: frames.map(f => f.toDataURL('image/png')),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    showSaveIndicator('💾 Auto-saved');
  } catch (e) {
    console.warn('Auto-save failed (storage full?):', e);
  }
}


function showSaveIndicator(msg) {
  let el = document.getElementById('saveIndicator');
  if (!el) {
    el = document.createElement('div');
    el.id = 'saveIndicator';
    Object.assign(el.style, {
      position: 'fixed', bottom: '12px', left: '50%', transform: 'translateX(-50%)',
      background: 'rgba(46,204,113,0.9)', color: '#000', fontWeight: '700',
      fontSize: '12px', padding: '4px 14px', borderRadius: '20px',
      pointerEvents: 'none', zIndex: '9999', transition: 'opacity 0.5s',
    });
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.opacity = '0'; }, 2000);
}


// Decode an array of PNG data URLs back into frame canvases.
function framesFromDataURLs(urls) {
  return Promise.all(urls.map(url => new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = FRAME_W; c.height = FRAME_H;
      c.getContext('2d').drawImage(img, 0, 0);
      resolve(c);
    };
    img.onerror = () => resolve(makeBlankFrame());
    img.src = url;
  })));
}


// Adopt a decoded set of frames as the current animation.
function loadProjectData(frameCanvases, savedFps, savedIdx) {
  frames = frameCanvases;
  undoStack = frames.map(() => []);
  fps = Math.min(24, Math.max(1, savedFps || 8));
  document.getElementById('fpsRange').value = fps;
  document.getElementById('fpsVal').textContent = fps;
  rebuildStrip();
  switchTo(Math.min(savedIdx || 0, frames.length - 1));
}


async function restoreFrames() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.frames || !data.frames.length) return false;


    loadProjectData(await framesFromDataURLs(data.frames), data.fps, data.currentIdx);
    showSaveIndicator('✅ Animation restored!');
    return true;
  } catch (e) {
    console.warn('Restore failed:', e);
    return false;
  }
}


// ── PROJECT SAVE / IMPORT ─────────────────────────────────
// Save the whole project to a file the user can keep and reopen later
// (same shape as the localStorage autosave, plus a version tag).
document.getElementById('saveProjectBtn').addEventListener('click', () => {
  const project = {
    app: 'stopmotion-studio',
    version: 1,
    width: FRAME_W,
    height: FRAME_H,
    fps,
    currentIdx,
    frames: frames.map(f => f.toDataURL('image/png')),
  };
  downloadBlob(new Blob([JSON.stringify(project)], { type: 'application/json' }),
               'stopmotion-project.json');
  showSaveIndicator('💾 Project saved to file');
});


// Import a previously-saved project file and resume it.
const importFileInput = document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click', () => importFileInput.click());
importFileInput.addEventListener('change', async () => {
  const file = importFileInput.files && importFileInput.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.frames) || data.frames.length === 0) {
      throw new Error('this file has no frames.');
    }
    if (!confirm('Import this project? It will replace your current animation.')) return;


    if (isPlaying) stopPlay();
    loadProjectData(await framesFromDataURLs(data.frames), data.fps, data.currentIdx);
    persistFrames();  // make the imported project the resumable session too
    showSaveIndicator('✅ Project imported!');
  } catch (err) {
    console.error('Import failed:', err);
    alert('Could not import this file: ' + err.message);
  } finally {
    importFileInput.value = '';  // allow re-importing the same file
  }
});


// Hook auto-save into every action that changes frames
const _origEndDraw = endDraw;
display.addEventListener('mouseup', scheduleSave);
display.addEventListener('touchend', scheduleSave);


const _origAddFrame = addFrame;
// Wrap addFrame & deleteFrame to also save
const __addFrame = addFrame;
window.addFrame = function(dup) { __addFrame(dup); scheduleSave(); };
addBtn.addEventListener('click', scheduleSave);
document.getElementById('dupBtn').addEventListener('click', scheduleSave);


// New animation button
document.getElementById('newBtn').addEventListener('click', () => {
  if (!confirm('Start a new animation? This will clear all frames.')) return;
  localStorage.removeItem(STORAGE_KEY);
  frames = [makeBlankFrame(), makeBlankFrame(), makeBlankFrame()];
  undoStack = [[], [], []];
  rebuildStrip();
  switchTo(0);
});


// ── INIT ──────────────────────────────────────────────────
async function init() {
  resizeDisplay();
  const restored = await restoreFrames();
  if (!restored) {
    frames = [makeBlankFrame(), makeBlankFrame(), makeBlankFrame()];
    undoStack = [[], [], []];
    rebuildStrip();
    switchTo(0);
  }
}


init();
</script>
